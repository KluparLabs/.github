# Reusable secrets scan for every KluparLabs repo. Full-history gitleaks, the
# bare binary (not gitleaks-action, which calls the PR API that a
# contents: read token refuses). The gitleaks pin lives here once; a repo's
# ci.yml calls this instead of carrying its own copy:
#
#   secrets-scan:
#     uses: KluparLabs/.github/.github/workflows/secrets-scan.yml@main
#
# A caller's own .gitleaks.toml at its repo root is picked up automatically.
# For a private caller, this repo's Actions access must allow the org:
# Settings > Actions > General > Access, "Accessible from repositories in the
# organization".
name: Secrets scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks release to run (without the v)
        type: string
        required: false
        default: "8.24.3"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Secrets scan
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --source .
